# Single-GPU starting profile for one RTX 5070 (SM120, 12 GB), scaled down from qwen3_asr_rtx5090.yaml; not yet qualified under issue #1120.
config_cls: Qwen3ASRPipelineConfig
name: qwen3-asr-rtx5070
model_path: Qwen/Qwen3-ASR-1.7B

stages:
  asr:
    factory:
      dtype: bfloat16
    engine:
      max_running_requests: 8
      cuda_graph_max_bs: 8
      mem_fraction_static: 0.75
      enable_torch_compile: false
