# Single-GPU profile for one 12 GB RTX 5070 (SM120), qualified for roadmap issue #1120; long audio (> 30 s) admits one request at a time and answers others with HTTP 503.
config_cls: Qwen3ASRPipelineConfig
name: qwen3-asr-rtx5070
model_path: Qwen/Qwen3-ASR-1.7B

stages:
  asr:
    factory:
      dtype: bfloat16
    engine:
      max_running_requests: 8
      cuda_graph_max_bs: 8
      mem_fraction_static: 0.75
      enable_torch_compile: false
